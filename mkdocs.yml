site_name: Praxis-Wiki
site_description: Internes Praxismanagement-Handbuch der Gemeinschaftspraxis Dres. Eckert
site_author: Gemeinschaftspraxis Dres. Eckert
site_url: http://handbuch.intern/

theme:
  name: material
  language: de
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search:
      lang: de

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Start: index.md

  - Leistungsblätter:
      - Übersicht: leistungsblaetter/index.md
      - Gutachten und Bescheinigungen:
          - Sportboottauglichkeit:
              - LB-5101 – Sportboottauglichkeit: 5000_Gutachten/LB-5101-Sportboottauglichkeit.md
              - FO-5101 – Sportboottauglichkeit – Anamnesebogen: 5000_Gutachten/formulare/FO-5101-Sportboottauglichkeit-Anamnesebogen.md
              - FO-5102 – Sportboottauglichkeit – Tauglichkeitsnachweis: 5000_Gutachten/formulare/FO-5102-Sportboottauglichkeit-Tauglichkeitsnachweis.pdf
              - FO-5103 – Sportboottauglichkeit – Kostenübernahmevereinbarung: 5000_Gutachten/formulare/FO-5103-Sportboottauglichkeit-Kostenuebernahmevereinbarung.md
              - PI-5101 – Sportboottauglichkeit – Medizinische Tauglichkeitskriterien: 5000_Gutachten/patienteninformationen/PI-5101-Sportboottauglichkeit-Medizinische-Tauglichkeitskriterien.pdf

  - GOÄ und Honorar:
      - Übersicht: goae/index.md

  - Qualitätsmanagement:
      - Übersicht: qm/index.md

  - Notfallmanagement:
      - Übersicht: notfall/index.md

extra:
  generator: false

copyright: Gemeinschaftspraxis Dres. Eckert · Am Ringpark 1A · 01640 Coswig
